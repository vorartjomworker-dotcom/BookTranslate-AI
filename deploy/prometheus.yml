global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: booktranslate-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics_token
