{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "booktranslate.fullname" . }}
  labels:
    {{- include "booktranslate.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className | quote }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tls.secretName | quote }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "booktranslate.fullname" . }}-backend
                port: {name: http}
          - path: /scim
            pathType: Prefix
            backend:
              service:
                name: {{ include "booktranslate.fullname" . }}-backend
                port: {name: http}
          - path: /health
            pathType: Exact
            backend:
              service:
                name: {{ include "booktranslate.fullname" . }}-backend
                port: {name: http}
          - path: /liveness
            pathType: Exact
            backend:
              service:
                name: {{ include "booktranslate.fullname" . }}-backend
                port: {name: http}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "booktranslate.fullname" . }}-frontend
                port: {name: http}
{{- end }}
