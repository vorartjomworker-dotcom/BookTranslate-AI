name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://booktranslate:booktranslate@localhost:5432/booktranslate
      REDIS_URL: redis://localhost:6379/0
      RUN_DB_INTEGRATION: "1"
      UPLOAD_DIR: /tmp/booktranslate-uploads

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: booktranslate
          POSTGRES_USER: booktranslate
          POSTGRES_PASSWORD: booktranslate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U booktranslate -d booktranslate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m compileall app alembic tests
      - name: Validate database migrations
        run: alembic upgrade head
      - name: Validate operations scripts and Compose
        shell: bash
        run: |
          bash -n ../scripts/backup.sh ../scripts/restore.sh
          docker compose -f ../docker-compose.yml config -q
      - name: Validate production deployment
        shell: bash
        run: |
          set -euo pipefail
          secret_dir=../deploy/secrets
          mkdir -p "$secret_dir"
          for name in database_url redis_url postgres_password redis_password bootstrap_admin_token auth_signing_secret oidc_client_secret s3_access_key s3_secret_key openai_api_key kimi_api_key gemini_api_key aitunnel_api_key metrics_token; do
            printf 'ci-placeholder\n' > "$secret_dir/$name.txt"
          done
          printf 'postgresql+asyncpg://booktranslate:ci@postgres:5432/booktranslate\n' > "$secret_dir/database_url.txt"
          printf 'redis://:ci@redis:6379/0\n' > "$secret_dir/redis_url.txt"
          APP_DOMAIN=translate.example.test MINIO_ROOT_USER=ci-minio MINIO_ROOT_PASSWORD=ci-minio-secret \
            docker compose --env-file ../deploy/.env.production.example -f ../deploy/docker-compose.prod.yml config -q
          mkdir -p /tmp/booktranslate-ci-tls
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 -subj '/CN=translate.example.test' \
            -keyout /tmp/booktranslate-ci-tls/privkey.pem -out /tmp/booktranslate-ci-tls/fullchain.pem >/dev/null 2>&1
          docker run --rm \
            -e APP_DOMAIN=translate.example.test \
            -v "$PWD/../deploy/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro" \
            -v /tmp/booktranslate-ci-tls:/etc/nginx/tls:ro \
            nginx:1.27-alpine nginx -t
          rm -f "$secret_dir"/*.txt
      - name: Run backend tests
        shell: bash
        run: |
          set +e
          python -m pytest -q --tb=short 2>&1 | tee pytest-output.txt
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            {
              echo "### Backend pytest failure"
              echo '```text'
              cat pytest-output.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$code"
      - name: Upload pytest output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-pytest-output
          path: backend/pytest-output.txt
          if-no-files-found: error

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package.json
      - run: npm install
      - run: npm run build
