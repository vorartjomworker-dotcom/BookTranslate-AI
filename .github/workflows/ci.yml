name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://booktranslate:booktranslate@localhost:5432/booktranslate
      REDIS_URL: redis://localhost:6379/0
      RUN_DB_INTEGRATION: "1"
      UPLOAD_DIR: /tmp/booktranslate-uploads

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: booktranslate
          POSTGRES_USER: booktranslate
          POSTGRES_PASSWORD: booktranslate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U booktranslate -d booktranslate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m compileall app alembic tests
      - name: Validate database migrations
        run: alembic upgrade head
      - name: Validate operations scripts and Compose
        shell: bash
        run: |
          bash -n ../scripts/backup.sh ../scripts/restore.sh
          docker compose -f ../docker-compose.yml config -q
      - name: Run backend tests
        shell: bash
        run: |
          set +e
          python -m pytest -q --tb=short 2>&1 | tee pytest-output.txt
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            {
              echo "### Backend pytest failure"
              echo '```text'
              cat pytest-output.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$code"
      - name: Upload pytest output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-pytest-output
          path: backend/pytest-output.txt
          if-no-files-found: error

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package.json
      - run: npm install
      - run: npm run build
