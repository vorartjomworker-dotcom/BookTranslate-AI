services:
  frontend:
    build:
      context: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://booktranslate:booktranslate@postgres:5432/booktranslate}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      UPLOAD_DIR: ${UPLOAD_DIR:-/data/uploads}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-100}
      AUTH_REQUIRED: ${AUTH_REQUIRED:-false}
      BOOTSTRAP_ADMIN_TOKEN: ${BOOTSTRAP_ADMIN_TOKEN:-}
      AUTH_SIGNING_SECRET: ${AUTH_SIGNING_SECRET:-}
      DOWNLOAD_TICKET_TTL_SECONDS: ${DOWNLOAD_TICKET_TTL_SECONDS:-120}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      OIDC_ENABLED: ${OIDC_ENABLED:-false}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-http://localhost:8000/api/auth/oidc/callback}
      OIDC_FRONTEND_REDIRECT_URI: ${OIDC_FRONTEND_REDIRECT_URI:-http://localhost:3000/auth/callback}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid email profile}
      OIDC_ROLE_CLAIM: ${OIDC_ROLE_CLAIM:-booktranslate_role}
      OIDC_DEFAULT_ROLE: ${OIDC_DEFAULT_ROLE:-viewer}
      AI_REQUEST_TIMEOUT_SECONDS: ${AI_REQUEST_TIMEOUT_SECONDS:-120}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      KIMI_API_KEY: ${KIMI_API_KEY:-}
      KIMI_BASE_URL: ${KIMI_BASE_URL:-https://api.moonshot.ai/v1}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}
      AITUNNEL_API_KEY: ${AITUNNEL_API_KEY:-}
      AITUNNEL_BASE_URL: ${AITUNNEL_BASE_URL:-https://api.aitunnel.ru/v1}
      VISION_PROVIDER: ${VISION_PROVIDER:-openai}
      VISION_MODEL: ${VISION_MODEL:-}
      VISION_QUEUE_NAME: ${VISION_QUEUE_NAME:-vision}
      VISION_WORKER_POLL_SECONDS: ${VISION_WORKER_POLL_SECONDS:-5}
      VISION_JOB_RECOVERY_AGE_SECONDS: ${VISION_JOB_RECOVERY_AGE_SECONDS:-900}
      TRANSLATION_QUEUE_NAME: ${TRANSLATION_QUEUE_NAME:-translation}
      TRANSLATION_WORKER_POLL_SECONDS: ${TRANSLATION_WORKER_POLL_SECONDS:-5}
      TRANSLATION_JOB_RECOVERY_AGE_SECONDS: ${TRANSLATION_JOB_RECOVERY_AGE_SECONDS:-900}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      AUDIT_ENABLED: ${AUDIT_ENABLED:-true}
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/data/uploads
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://booktranslate:booktranslate@postgres:5432/booktranslate}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      UPLOAD_DIR: ${UPLOAD_DIR:-/data/uploads}
      AI_REQUEST_TIMEOUT_SECONDS: ${AI_REQUEST_TIMEOUT_SECONDS:-120}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      KIMI_API_KEY: ${KIMI_API_KEY:-}
      KIMI_BASE_URL: ${KIMI_BASE_URL:-https://api.moonshot.ai/v1}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}
      AITUNNEL_API_KEY: ${AITUNNEL_API_KEY:-}
      AITUNNEL_BASE_URL: ${AITUNNEL_BASE_URL:-https://api.aitunnel.ru/v1}
      TRANSLATION_QUEUE_NAME: ${TRANSLATION_QUEUE_NAME:-translation}
      TRANSLATION_WORKER_POLL_SECONDS: ${TRANSLATION_WORKER_POLL_SECONDS:-5}
      TRANSLATION_JOB_RECOVERY_AGE_SECONDS: ${TRANSLATION_JOB_RECOVERY_AGE_SECONDS:-900}
    command: ["python", "-m", "app.workers.translation_worker"]
    volumes:
      - uploads_data:/data/uploads
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy

  vision-worker:
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://booktranslate:booktranslate@postgres:5432/booktranslate}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      UPLOAD_DIR: ${UPLOAD_DIR:-/data/uploads}
      AI_REQUEST_TIMEOUT_SECONDS: ${AI_REQUEST_TIMEOUT_SECONDS:-120}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      VISION_PROVIDER: ${VISION_PROVIDER:-openai}
      VISION_MODEL: ${VISION_MODEL:-}
      VISION_QUEUE_NAME: ${VISION_QUEUE_NAME:-vision}
      VISION_WORKER_POLL_SECONDS: ${VISION_WORKER_POLL_SECONDS:-5}
      VISION_JOB_RECOVERY_AGE_SECONDS: ${VISION_JOB_RECOVERY_AGE_SECONDS:-900}
    command: ["python", "-m", "app.workers.vision_worker"]
    volumes:
      - uploads_data:/data/uploads
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-booktranslate}
      POSTGRES_USER: ${POSTGRES_USER:-booktranslate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-booktranslate}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-booktranslate} -d ${POSTGRES_DB:-booktranslate}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  uploads_data:
